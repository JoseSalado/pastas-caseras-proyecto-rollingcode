<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse</title>
  <link rel="shortcut icon" href="../img/LogoPastas.jpg" type="image/x-icon">
</head>
<body>
  <header>
    <img src="../img/LogoPastas.jpg" alt="Imagen Principal" width="100">
    <ul>
      <li>
        <a href="../index.html">Inicio</a>
      </li>
    </ul>
    
  </header>
  <main>
    <h1>Registrate</h1>
    <form action="">
     <label for="idnombreusuario">Nombre Usuario</label>
     <input type="text" id="idnombreusuario" placeholder="Por ejemplo : Usuario123" required minlength="6" maxlength="15">
     <br>
     <label for="idemail">Email</label>
     <input type="email" name="" id="idemail" required minlength="6" maxlength="50">
     <br>
     <label for="idtelefono">Numero de telefono</label>
     <input type="tel" name="" id="idtelefono" required minlength="6" maxlength="15">
     <br>
     <label for="idcontrasenia">Contraseña</label>
     <input type="password" name="" id="idcontrasenia" required minlength="8" maxlength="15">
     <br>
     <label for="idconfirmarcontrasenia">Confirmar contraseña</label>
     <input type="password" name="" id="idconfirmarcontrasenia" required minlength="8" maxlength="15">
     <br>
     <input type="checkbox" name="" id="idcheckbox">
     <label for="idcheckbox">Acepto terminos y condiciones</label>
     <br>
     <button>Registrarse</button>
     <br>
     <p>Si ya estas registado <a href="./login.html">Inicia Sesion</a></p>
    </form>
  </main>
</body>
</html>
